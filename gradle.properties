org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# The sandbox blocks the native file-watcher calls (error 5 / access denied),
# so VFS watching is disabled and Gradle falls back to stat-based change detection.
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# AGP hard-fails on non-ASCII project paths on Windows. This workspace path is
# fixed by the sandbox, so the check is opted out of deliberately.
android.overridePathCheck=true

kotlin.code.style=official
